# Deliberately broken workloads for kube-ops-mcp to diagnose.
apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
# Failure 1: CrashLoopBackOff — the app exits because DATABASE_URL is not set.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: demo
  labels:
    app: payment-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              echo "payment-service starting"
              if [ -z "$DATABASE_URL" ]; then
                echo "FATAL: required environment variable DATABASE_URL is not set" >&2
                exit 1
              fi
              while true; do sleep 3600; done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
---
# Failure 2: OOMKilled — the app allocates ~150Mi against a 64Mi memory limit.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendation-service
  namespace: demo
  labels:
    app: recommendation-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: recommendation-service
  template:
    metadata:
      labels:
        app: recommendation-service
    spec:
      containers:
        - name: app
          image: polinux/stress:1.0.4
          command: ["stress"]
          args: ["--vm", "1", "--vm-bytes", "150M", "--vm-hang", "1"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
---
# Healthy baseline, so the assistant can tell broken from working.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: demo
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: app
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
