name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.4"
  HELM_VERSION: "v4.3.1"
  KIND_NODE_IMAGE: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5

jobs:
  test:
    name: Lint and test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - run: helm lint deploy/helm/kube-ops-mcp --strict
      - run: helm lint deploy/helm/kube-ops-mcp --strict --set write.enabled=true --set 'write.allowedNamespaces={demo}'
      - name: Write mode without namespaces must be refused
        run: "! helm template t deploy/helm/kube-ops-mcp --set write.enabled=true"

  e2e:
    name: Image scan and kind smoke test
    needs: [test, helm]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: kube-ops-mcp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan image for fixable HIGH/CRITICAL vulnerabilities
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c image --exit-code 1 --ignore-unfixed \
            --severity HIGH,CRITICAL kube-ops-mcp:ci
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          version: v0.33.0
          node_image: ${{ env.KIND_NODE_IMAGE }}
          cluster_name: ci
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Deploy demo apps and the chart
        run: |
          kind load docker-image kube-ops-mcp:ci --name ci
          kubectl apply -f demo/broken-apps.yaml
          helm install kube-ops-mcp deploy/helm/kube-ops-mcp -n kube-ops --create-namespace \
            --set image.repository=kube-ops-mcp --set image.tag=ci --set image.pullPolicy=Never \
            --set clusterName=ci --wait --timeout 3m
          helm test kube-ops-mcp -n kube-ops
      - name: Wait for the demo failures
        run: |
          kubectl -n demo wait pod -l app=payment-service --timeout=180s \
            --for=jsonpath='{.status.containerStatuses[0].restartCount}'=1
          kubectl -n demo wait pod -l app=recommendation-service --timeout=180s \
            --for=jsonpath='{.status.containerStatuses[0].restartCount}'=1
      - name: Check RBAC is read-only
        run: |
          sa=system:serviceaccount:kube-ops:kube-ops-mcp
          kubectl auth can-i list pods -n demo --as="$sa"
          for check in "get secrets" "get configmaps" "delete pods" "patch deployments.apps"; do
            read -r -a args <<< "$check"
            if kubectl auth can-i "${args[@]}" -n demo --as="$sa"; then
              echo "unexpected permission: $check"; exit 1
            fi
          done
      - name: Smoke test over MCP
        run: |
          kubectl -n kube-ops port-forward svc/kube-ops-mcp 8000:8000 &
          for _ in $(seq 1 30); do curl -sf localhost:8000/healthz && break; sleep 1; done
          uv run python scripts/smoke_test.py http://localhost:8000/mcp ci
      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -A
          kubectl -n kube-ops logs deploy/kube-ops-mcp --tail=100
